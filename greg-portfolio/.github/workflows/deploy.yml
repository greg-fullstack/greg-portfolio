name: Deploy portfolio to GitHub Pages

# The site is now plain static HTML/CSS/JS (no Angular build step), so this
# workflow just publishes the repository as-is to the gh-pages branch,
# replacing the old local "ng build && angular-cli-ghpages" flow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github,.git,README.md,.gitignore,.editorconfig'
